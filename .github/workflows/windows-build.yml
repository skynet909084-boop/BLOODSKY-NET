name: Windows executable
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  exe:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6,<7"
      - name: Validate SNMP imports
        run: python -c "from pysnmp.hlapi.v3arch.asyncio import SnmpEngine, walk_cmd, USM_AUTH_HMAC192_SHA256, USM_PRIV_CFB128_AES"
      - name: Compile and test
        run: |
          python -m compileall -q app.py bloodsky_net
          python -m unittest discover -s tests -v
          python tools/soak_test.py
      - name: Build portable EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-all pysnmp --collect-all Cryptodome --collect-all pystray --collect-all PIL --collect-all cryptography --name BLOODSKY-NET app.py
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build per-user Windows installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { $compiler = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $compiler)) { throw 'Inno Setup compiler not installed' }
          & $compiler 'installer\BLOODSKY-NET.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
      - name: Windows silent install, EXE and uninstall smoke
        shell: pwsh
        run: ./tools/windows_install_smoke.ps1
      - name: Generate SHA-256 artifact checksums
        shell: pwsh
        run: |
          $paths = @('dist/BLOODSKY-NET.exe') + @(Get-ChildItem installer/output/BLOODSKY-NET-Setup-*.exe | ForEach-Object FullName)
          $paths | ForEach-Object { "$((Get-FileHash -Algorithm SHA256 $_).Hash)  $(Split-Path $_ -Leaf)" } | Out-File -FilePath checksums-sha256.txt -Encoding utf8
      - name: Upload artifact checksums
        uses: actions/upload-artifact@v4
        with:
          name: BLOODSKY-NET-SHA256
          path: checksums-sha256.txt
          if-no-files-found: error
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: BLOODSKY-NET-Installer
          path: installer/output/BLOODSKY-NET-Setup-*.exe
          if-no-files-found: error
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: BLOODSKY-NET-Windows
          path: dist/BLOODSKY-NET.exe
          if-no-files-found: error
