name: Windows executable
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  exe:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6,<7"
      - name: Validate SNMP imports
        run: python -c "from pysnmp.hlapi.v3arch.asyncio import SnmpEngine, walk_cmd, USM_AUTH_HMAC192_SHA256, USM_PRIV_CFB128_AES"
      - name: Generate BLOODSKY Windows icons
        run: python tools/build_branding.py
      - name: Compile and test
        run: |
          python -m compileall -q app.py bloodsky_net
          python -m unittest discover -s tests -v
          python tools/soak_test.py
          python tools/probe_stability_soak.py
          python tools/probe_security_soak.py
      - name: Build portable EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-all pysnmp --collect-all Cryptodome --collect-all pystray --collect-all PIL --collect-all cryptography --collect-all pymanuf --icon assets/BLOODSKY-NET.ico --name BLOODSKY-NET app.py
      - name: Verify embedded BLOODSKY EXE icon
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from PIL import Image
          import pefile
          exe = Path("dist/BLOODSKY-NET.exe")
          assert exe.is_file() and exe.stat().st_size > 1024 * 1024
          with Image.open("assets/BLOODSKY-NET.ico") as icon:
              assert icon.size == (256, 256)
          pe = pefile.PE(str(exe), fast_load=False)
          resources = [e.id for e in pe.DIRECTORY_ENTRY_RESOURCE.entries]
          assert 14 in resources and 3 in resources, "Windows icon missing from EXE"
          print("BLOODSKY icon present in EXE resource table")
          '@ | python -
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build per-user Windows installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { $compiler = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $compiler)) { throw 'Inno Setup compiler not installed' }
          & $compiler 'installer\BLOODSKY-NET.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
      - name: Windows silent install, EXE and uninstall smoke
        shell: pwsh
        run: ./tools/windows_install_smoke.ps1
      - name: Generate SHA-256 artifact checksums
        shell: pwsh
        run: |
          $paths = @('dist/BLOODSKY-NET.exe') + @(Get-ChildItem installer/output/BLOODSKY-NET-Setup-*.exe | ForEach-Object FullName)
          $paths | ForEach-Object { "$((Get-FileHash -Algorithm SHA256 $_).Hash)  $(Split-Path $_ -Leaf)" } | Out-File -FilePath checksums-sha256.txt -Encoding utf8
      - name: Upload artifact checksums
        uses: actions/upload-artifact@v4
        with:
          name: BLOODSKY-NET-SHA256
          path: checksums-sha256.txt
          if-no-files-found: error
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: BLOODSKY-NET-Installer
          path: installer/output/BLOODSKY-NET-Setup-*.exe
          if-no-files-found: error
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: BLOODSKY-NET-Windows
          path: dist/BLOODSKY-NET.exe
          if-no-files-found: error

  publish_release:
    if: github.event_name == 'release'
    needs: exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: BLOODSKY-NET-*
          path: release-files
          merge-multiple: true
      - name: Attach verified Windows artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh release-files
          gh release upload "${{ github.event.release.tag_name }}" release-files/BLOODSKY-NET.exe release-files/BLOODSKY-NET-Setup-*.exe release-files/checksums-sha256.txt --clobber --repo "${{ github.repository }}"
